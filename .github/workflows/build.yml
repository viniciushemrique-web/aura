name: Gerar instalador Windows

on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - uses: dtolnay/rust-toolchain@stable
      - uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
      - run: npm install
      - run: npx tauri icon app-icon.png
      - name: Compilar (.env a partir dos Secrets)
        shell: pwsh
        run: |
          @"
          VITE_NOME_ASSISTENTE=${{ secrets.VITE_NOME_ASSISTENTE }}
          VITE_GEMINI_API_KEY=${{ secrets.VITE_GEMINI_API_KEY }}
          VITE_GEMINI_MODEL=${{ secrets.VITE_GEMINI_MODEL }}
          VITE_SPOTIFY_CLIENT_ID=${{ secrets.VITE_SPOTIFY_CLIENT_ID }}
          VITE_SPOTIFY_REFRESH_TOKEN=${{ secrets.VITE_SPOTIFY_REFRESH_TOKEN }}
          VITE_CHAVE_PIX=${{ secrets.VITE_CHAVE_PIX }}
          "@ | Set-Content .env
          npm run tauri build
      - uses: actions/upload-artifact@v4
        with:
          name: Aura-instalador
          path: src-tauri/target/release/bundle/nsis/*.exe
